services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: fulgencio-backend
    env_file:
      - ./back/.env
    ports:
      - "8000:8000"
    environment:
      - LITELLM_PROXY_HTTP_URL=http://litellm:4000
      - LITELLM_PROXY_WS_URL=ws://litellm:4000
      - LITELLM_PROXY_API_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local-dev}
    volumes:
      - ./back:/app
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - fulgencio-network

  litellm:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: fulgencio-litellm
    env_file:
      - ./back/.env
    command: ["python", "/app/run_litellm_proxy.py"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local-dev}
      - LITELLM_HOST=0.0.0.0
      - LITELLM_PORT=4000
    volumes:
      - ./back:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/health/liveliness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - fulgencio-network

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: fulgencio-frontend
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      # La URL del WebSocket se resuelve dinámicamente en el cliente
      # usando window.location.hostname, así que no necesita configuración aquí
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fulgencio-network

networks:
  fulgencio-network:
    driver: bridge

