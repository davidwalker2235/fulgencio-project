name: Deploy to Azure

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: fulgencio-rg
  AZURE_LOCATION: West Europe
  ACR_NAME: fulgencioacr
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend
  TFSTATE_RESOURCE_GROUP: fulgencio-tfstate-rg
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: fulgencio.terraform.tfstate

  TF_VAR_azure_openai_endpoint: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  TF_VAR_azure_openai_api_key: ${{ secrets.AZURE_OPENAI_API_KEY }}
  TF_VAR_azure_openai_api_version: ${{ secrets.AZURE_OPENAI_API_VERSION }}
  TF_VAR_model_name: gpt-realtime-1.5
  TF_VAR_litellm_master_key: ${{ secrets.LITELLM_MASTER_KEY }}
  TF_VAR_voice_agent_type: ${{ vars.VOICE_AGENT_TYPE || 'erni_agent' }}
  TF_VAR_erni_agent_url: ${{ secrets.ERNI_AGENT_URL }}

  TF_VAR_model_image_name: gpt-image-2
  TF_VAR_azure_openai_image_api_key: ${{ secrets.AZURE_OPENAI_IMAGE_API_KEY }}
  TF_VAR_azure_openai_image_api_version: ${{ secrets.AZURE_OPENAI_IMAGE_API_VERSION }}
  TF_VAR_azure_openai_image_endpoint: ${{ secrets.AZURE_OPENAI_IMAGE_ENDPOINT }}
  TF_VAR_azure_openai_image_edits_endpoint: ${{ secrets.AZURE_OPENAI_IMAGE_EDITS_ENDPOINT }}

  TF_VAR_firebase_database_url: ${{ secrets.FIREBASE_DATABASE_URL }}
  TF_VAR_firebase_service_account_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
  TF_VAR_azure_sql_connection_string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
  TF_VAR_backend_image_tag: ${{ github.sha }}
  TF_VAR_frontend_image_tag: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          required=(
            AZURE_CREDENTIALS_JSON
            TF_VAR_azure_openai_endpoint
            TF_VAR_azure_openai_api_key
            TF_VAR_azure_openai_api_version
            TF_VAR_litellm_master_key
            TF_VAR_azure_openai_image_api_key
            TF_VAR_azure_openai_image_api_version
            TF_VAR_azure_openai_image_edits_endpoint
            TF_VAR_firebase_database_url
            TF_VAR_firebase_service_account_json
            TF_VAR_azure_sql_connection_string
            FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN
            FIREBASE_PROJECT_ID
            FIREBASE_STORAGE_BUCKET
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_APP_ID
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "$TF_VAR_voice_agent_type" = "erni_agent" ] && [ -z "$TF_VAR_erni_agent_url" ]; then
            missing+=("TF_VAR_erni_agent_url")
          fi

          if [ "${TF_VAR_litellm_master_key#sk-}" = "$TF_VAR_litellm_master_key" ] ||
             [ "${#TF_VAR_litellm_master_key}" -lt 16 ]; then
            echo "LITELLM_MASTER_KEY debe empezar por sk- y tener al menos 16 caracteres."
            exit 1
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Faltan secrets requeridos:"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Install backend dependencies
        working-directory: ./back
        run: python -m pip install -r requirements.txt

      - name: Test backend
        working-directory: ./back
        run: python -B -m unittest discover -s tests -v

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.1

      - name: Check Terraform formatting
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Validate Terraform
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate

  setup-infrastructure:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.1

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure and Terraform state
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        shell: bash
        run: |
          subscription_id=$(jq -r '.subscriptionId' <<< "$AZURE_CREDENTIALS_JSON")
          compact_subscription=$(tr -d '-' <<< "$subscription_id")
          state_account="fulgenciotf${compact_subscription:0:10}"

          echo "ARM_SUBSCRIPTION_ID=$subscription_id" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=$state_account" >> "$GITHUB_ENV"

      - name: Bootstrap Terraform state storage
        shell: bash
        run: |
          az group create \
            --name "$TFSTATE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

          if ! az storage account show \
            --name "$TFSTATE_STORAGE_ACCOUNT" \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --output none 2>/dev/null; then
            az storage account create \
              --name "$TFSTATE_STORAGE_ACCOUNT" \
              --resource-group "$TFSTATE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --output none
          fi

          state_access_key=$(az storage account keys list \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --query '[0].value' \
            --output tsv)
          echo "::add-mask::$state_access_key"
          echo "ARM_ACCESS_KEY=$state_access_key" >> "$GITHUB_ENV"

          az storage container create \
            --name "$TFSTATE_CONTAINER" \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --account-key "$state_access_key" \
            --public-access off \
            --output none

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY"

      - name: Import existing base resources
        working-directory: ./terraform
        shell: bash
        run: |
          if az group show --name "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            if ! terraform state show azurerm_resource_group.main >/dev/null 2>&1; then
              resource_group_id=$(az group show --name "$AZURE_RESOURCE_GROUP" --query id --output tsv)
              terraform import azurerm_resource_group.main "$resource_group_id"
            fi
          fi

          if az acr show --name "$ACR_NAME" --output none 2>/dev/null; then
            if ! terraform state show azurerm_container_registry.main >/dev/null 2>&1; then
              acr_id=$(az acr show --name "$ACR_NAME" --query id --output tsv)
              terraform import azurerm_container_registry.main "$acr_id"
            fi
          fi

      - name: Terraform Plan base infrastructure
        working-directory: ./terraform
        run: |
          terraform plan \
            -target=azurerm_resource_group.main \
            -target=azurerm_container_registry.main \
            -out=tfplan-acr

      - name: Terraform Apply base infrastructure
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan-acr

  build-and-push:
    needs: setup-infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get ACR credentials
        id: acr-creds
        shell: bash
        run: |
          acr_username=$(az acr credential show --name "$ACR_NAME" --query username --output tsv)
          acr_password=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' --output tsv)
          echo "::add-mask::$acr_password"
          echo "username=$acr_username" >> "$GITHUB_OUTPUT"
          echo "password=$acr_password" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ steps.acr-creds.outputs.username }}
          password: ${{ steps.acr-creds.outputs.password }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.1

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure and Terraform state
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        shell: bash
        run: |
          subscription_id=$(jq -r '.subscriptionId' <<< "$AZURE_CREDENTIALS_JSON")
          compact_subscription=$(tr -d '-' <<< "$subscription_id")
          state_account="fulgenciotf${compact_subscription:0:10}"

          echo "ARM_SUBSCRIPTION_ID=$subscription_id" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=$state_account" >> "$GITHUB_ENV"

          state_access_key=$(az storage account keys list \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --account-name "$state_account" \
            --query '[0].value' \
            --output tsv)
          echo "::add-mask::$state_access_key"
          echo "ARM_ACCESS_KEY=$state_access_key" >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY"

      - name: Import existing managed resources
        working-directory: ./terraform
        shell: bash
        run: |
          import_if_missing() {
            address="$1"
            resource_id="$2"
            # az CLI puede devolver segmentos ARM en minúsculas. Los parsers
            # de IDs de Terraform requieren el casing canónico de esos tipos.
            resource_id=$(sed -E \
              -e 's#/[Rr][Ee][Ss][Oo][Uu][Rr][Cc][Ee][Gg][Rr][Oo][Uu][Pp][Ss]/#/resourceGroups/#g' \
              -e 's#/[Cc][Oo][Nn][Tt][Aa][Ii][Nn][Ee][Rr][Aa][Pp][Pp][Ss]/#/containerApps/#g' \
              <<< "$resource_id")
            if [ -n "$resource_id" ] && ! terraform state show "$address" >/dev/null 2>&1; then
              terraform import "$address" "$resource_id"
            fi
          }

          logs_id=$(az monitor log-analytics workspace show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --workspace-name fulgencio-logs \
            --query id --output tsv 2>/dev/null || true)
          import_if_missing azurerm_log_analytics_workspace.main "$logs_id"

          identity_id=$(az identity show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name fulgencio-identity \
            --query id --output tsv 2>/dev/null || true)
          import_if_missing azurerm_user_assigned_identity.main "$identity_id"

          environment_id=$(az containerapp env show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name fulgencio-env \
            --query id --output tsv 2>/dev/null || true)
          import_if_missing azurerm_container_app_environment.main "$environment_id"

          if [ -n "$identity_id" ]; then
            principal_id=$(az identity show \
              --ids "$identity_id" \
              --query principalId --output tsv)
            acr_id=$(az acr show --name "$ACR_NAME" --query id --output tsv)
            role_id=$(az role assignment list \
              --scope "$acr_id" \
              --assignee "$principal_id" \
              --role AcrPull \
              --query '[0].id' --output tsv 2>/dev/null || true)
            import_if_missing azurerm_role_assignment.acr_pull "$role_id"
          fi

          backend_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name fulgencio-backend \
            --query id --output tsv 2>/dev/null || true)
          import_if_missing azurerm_container_app.backend "$backend_id"

          frontend_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name fulgencio-frontend \
            --query id --output tsv 2>/dev/null || true)
          import_if_missing azurerm_container_app.frontend "$frontend_id"

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Verify deployed services
        working-directory: ./terraform
        shell: bash
        run: |
          backend_url=$(terraform output -raw backend_url)
          frontend_url=$(terraform output -raw frontend_url)

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$backend_url/health"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$frontend_url/"

      - name: Output deployment URLs
        working-directory: ./terraform
        shell: bash
        run: |
          {
            echo "## Deployment URLs"
            echo
            echo "**Frontend:** $(terraform output -raw frontend_url)"
            echo "**Backend:** $(terraform output -raw backend_url)"
          } >> "$GITHUB_STEP_SUMMARY"
